<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">

    <title>The Vault | 400+ Independent Toronto & Global Reviews by MsJAG</title>
    <meta name="description" content="Professional archive of 400+ independent reviews covering Toronto nightlife, dining, and global travel by MsJAG.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .bg-brand-green { background-color: #15803d; } 
        .text-brand-green { color: #15803d; }
        .bg-brand-orange { background-color: #ea580c; }
        .review-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; background: white; border-radius: 1rem; overflow: hidden; }
        .review-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .star-rating { color: #facc15; }
        .filter-btn.active { background-color: #ea580c; color: white; border-color: #ea580c; }
        .category-badge { font-size: 0.65rem; font-weight: 800; padding: 0.25rem 0.5rem; border-radius: 0.375rem; text-transform: uppercase; letter-spacing: 0.025em; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased min-h-screen pt-20">

    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md shadow-sm z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <span class="bg-brand-green text-white w-8 h-8 flex items-center justify-center rounded-full font-black text-sm group-hover:bg-brand-orange transition-colors">M</span>
                <span class="font-black text-xl tracking-tighter text-slate-900 group-hover:text-brand-orange transition-colors">MsJAG<span class="text-brand-green">.</span></span>
            </a>
            <div class="flex items-center gap-6">
                <a href="index.html" class="text-slate-600 font-bold text-sm hover:text-brand-green transition-colors">Home</a>
                <a href="#contact" class="hidden md:block bg-brand-orange text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-widest shadow-md hover:bg-orange-700 transition-colors">Media Inquiries</a>
            </div>
        </div>
    </nav>

    <header class="bg-slate-900 text-white py-16 px-6 relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-20 -mr-20 w-96 h-96 bg-brand-green opacity-10 rounded-full blur-3xl"></div>
        <div class="max-w-7xl mx-auto relative z-10">
            <span class="text-brand-orange font-black text-xs uppercase tracking-widest mb-4 block">Independent Media Archive</span>
            <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tight">The Verdict <span class="text-brand-green">Vault.</span></h1>
            <p class="text-lg md:text-xl text-slate-300 max-w-2xl font-medium mb-8">
                Unfiltered verdicts covering Toronto nightlife, dining, and global destinations based on years of verified experience.
            </p>
            
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-grow max-w-2xl">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search by name, neighborhood, or category..." class="w-full pl-12 pr-6 py-4 rounded-xl bg-slate-800 border-2 border-slate-700 text-white placeholder-slate-500 outline-none focus:border-brand-green transition-all font-bold text-sm">
                </div>
                <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0 no-scrollbar">
                    <button class="filter-btn active px-4 py-2 rounded-lg border-2 border-slate-700 text-[10px] font-black uppercase whitespace-nowrap transition-colors" onclick="setFilter('all', this)">All</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border-2 border-slate-700 text-[10px] font-black uppercase whitespace-nowrap transition-colors" onclick="setFilter('Dining', this)">Dining</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border-2 border-slate-700 text-[10px] font-black uppercase whitespace-nowrap transition-colors" onclick="setFilter('Nightlife', this)">Nightlife</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border-2 border-slate-700 text-[10px] font-black uppercase whitespace-nowrap transition-colors" onclick="setFilter('Travel', this)">Travel</button>
                    <button class="filter-btn px-4 py-2 rounded-lg border-2 border-slate-700 text-[10px] font-black uppercase whitespace-nowrap transition-colors" onclick="setFilter('Service', this)">Services</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 min-h-[400px]">
        <div id="reviewsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 py-12 px-6 text-center text-xs">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="font-bold uppercase tracking-widest">© 2026 MsJAG Reviews. Independent. Local. Authority.</p>
        </div>
    </footer>

    <script>
        const reviews = [
            {
                "category": "Service",
                "name": "BodyStats Toronto: Dexa Scan and Vo2 Max Testing",
                "address": "100 Western Battery Rd Unit 2, Toronto, ON M6K 3S2, Canada",
                "rating": 5,
                "comment": "BodyStats made getting a DEXA scan quick and stress-free. Paul the owner was professional and the whole appointment took about 15 minutes. The place was clean and organized. Results are emailed immediately after the scan so there's no waiting around.",
                "date": "Apr 06, 2026"
            },
            {
                "category": "Nightlife",
                "name": "Soluna Toronto",
                "address": "314 Queen St W, Toronto, ON M5V 2A2, Canada",
                "rating": 4,
                "comment": "Soluna is a welcomed reincarnation of Ultra. This place really shines as a party venue with beautiful decor and top-notch DJs. Solid spot if you want somewhere stylish where people really came to dance.",
                "date": "Apr 04, 2026"
            },
            {
                "category": "Service",
                "name": "BMW Etobicoke",
                "address": "440 Evans Ave., Etobicoke, ON M8Z 5X5, Canada",
                "rating": 5,
                "comment": "Best car maintenance experience I've had. Greeted warmly and shown the lounge with private seating areas. Peaceful oil-changing serenity.",
                "date": "Nov 21, 2025"
            },
            {
                "category": "Service",
                "name": "Speedy Glass",
                "address": "1642 The Queensway, Etobicoke, ON M8Z 1V1, Canada",
                "rating": 1,
                "comment": "No greeting and no eye contact. Staff response was weirdly aggressive. Competent work but zero interest in basic customer service.",
                "date": "Oct 20, 2025"
            },
            {
                "category": "Nightlife",
                "name": "Geary Avenue Warehouse Project",
                "address": "209 Geary Ave, Toronto, ON M6H 2C1, Canada",
                "rating": 5,
                "comment": "Went for ART OF US with Miss Tara. The atmosphere was EDM electric. Sound system was powerful and crisp with deep bass. Perfect balance of energy and ambience.",
                "date": "Oct 10, 2025"
            },
            {
                "category": "Dining",
                "name": "Burger Drops",
                "address": "116 Atlantic Ave, Toronto, ON M6K 1X9, Canada",
                "rating": 1,
                "comment": "I went with the Original Burger. Halfway through I got a surprise order of mystery bone. It honestly felt unsafe to eat. Reported to Toronto Public Health.",
                "date": "Sep 12, 2025"
            },
            {
                "category": "Dining",
                "name": "Queens Harbour",
                "address": "219 Queens Quay W, Toronto, ON M5J 2V4, Canada",
                "rating": 5,
                "comment": "The Caesar salad was delicious and the miso black cod was excellent. The patio has a live DJ and a full party scene.",
                "date": "Aug 16, 2025"
            },
            {
                "category": "Travel",
                "name": "Secrets Royal Beach Punta Cana",
                "address": "Dominican Republic",
                "rating": 3,
                "comment": "Room was decent but not spotless. Found items from the previous guest in the drawers. Adult-only pool areas and coffee at the Coco Cafe were the highlights.",
                "date": "Aug 15, 2025"
            },
            {
                "category": "Service",
                "name": "Linen Chest",
                "address": "5800 McLaughlin Rd Unit C, Mississauga, ON L5R 4B7, Canada",
                "rating": 2,
                "comment": "Received defective sheets and the customer service from head office was non-existent. They failed to reply to multiple emails about the damaged product.",
                "date": "Jul 19, 2012"
            }
        ];

        let currentFilter = 'all';
        const grid = document.getElementById('reviewsGrid');
        const searchInput = document.getElementById('searchInput');

        function getCategoryStyles(cat) {
            switch(cat) {
                case 'Dining': return 'bg-red-100 text-red-800';
                case 'Nightlife': return 'bg-purple-100 text-purple-800';
                case 'Travel': return 'bg-blue-100 text-blue-800';
                case 'Service': return 'bg-emerald-100 text-emerald-800';
                default: return 'bg-slate-100 text-slate-800';
            }
        }

        function setFilter(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderReviews(searchInput.value);
        }

        function renderReviews(searchTerm = "") {
            grid.innerHTML = "";
            const filtered = reviews.filter(r => {
                const matchesSearch = r.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                     r.comment.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                     r.address.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesFilter = currentFilter === 'all' || r.category === currentFilter;
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center"><p class="text-slate-400 font-black uppercase tracking-widest text-[10px]">No records found.</p></div>`;
                return;
            }

            filtered.forEach(r => {
                const stars = '<i class="fas fa-star"></i>'.repeat(r.rating);
                const emptyStars = '<i class="far fa-star"></i>'.repeat(5 - r.rating);
                const catStyle = getCategoryStyles(r.category);
                
                const card = `
                    <article class="review-card p-6 border border-slate-100 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-black text-xl text-slate-900 leading-tight">${r.name}</h3>
                                <p class="text-[10px] text-slate-400 font-black mt-1 uppercase tracking-widest">${r.address}</p>
                            </div>
                            <span class="category-badge ${catStyle}">${r.category}</span>
                        </div>
                        <div class="star-rating mb-4 text-xs">
                            ${stars}${emptyStars}
                        </div>
                        <p class="text-slate-600 leading-relaxed font-medium text-sm flex-grow">
                            "${r.comment}"
                        </p>
                        <div class="mt-6 pt-4 border-t border-slate-50 flex justify-between items-center text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                            <span>${r.date}</span>
                            <span class="text-brand-orange">Verified</span>
                        </div>
                    </article>
                `;
                grid.innerHTML += card;
            });
        }

        searchInput.addEventListener('input', (e) => renderReviews(e.target.value));
        renderReviews();
    </script>
</body>
</html>
