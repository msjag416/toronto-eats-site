name: Build Review Pages

# Rebuilds the review pages, city pages and sitemap whenever the review list changes.
on:
  push:
    branches: [main]
    paths:
      - 'archive.html'
      - 'index.html'
      - 'build_review_pages.py'
      - 'review-photos.json'
  workflow_dispatch:      # Lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-review-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the pages
        run: python build_review_pages.py

      - name: Save the new pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reviews toronto grand-cayman mississauga canada world sitemap.xml review-links.json review-photos.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild review pages"
            git pull --rebase origin main
            git push
          fi
