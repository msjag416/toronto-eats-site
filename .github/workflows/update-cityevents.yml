name: Update CityEvents feed

# Runs every day and can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC daily (about 5 a.m. Toronto time)
  workflow_dispatch: {}       # adds a "Run workflow" button

permissions:
  contents: write             # lets the job save events.json back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build events.json
        run: python build_cityevents.py

      - name: Save events.json if it changed
        run: |
          git config user.name "cityevents-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Update CityEvents feed [skip ci]"
          git push
