name: Daily CityEvents Sync

on:
  schedule:
    - cron: '0 8 * * *'  # Runs at 4:00 AM Eastern Time (8:00 AM UTC) daily
  workflow_dispatch:      # Allows you to trigger the sync manually from GitHub's interface

permissions:
  contents: write         # Grants permission to commit and push the updated cityevents.json back to your repo

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests httpx

      - name: Run CityEvents Ingestion Engine
        run: python build_cityevents.py || python build_city_events.py || python cityevents.py || python build_assets.py
        # Added build_cityevents.py to the front of the fallback chain to match your exact file name

      - name: Commit and Push Updated Feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cityevents.json
          
          # Only commit and push if the file actually changed to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes detected in cityevents.json."
          else
            git commit -m "Automated Ingestion Sync: cityevents.json updated [skip ci]"
            git push
          fi
